# Every run bundles documentation for tags from 2.5.x onward into the current docs.
name: Deploy KDocs

on:
  # Rebuild all documentation versions on pushes to master
  push:
    branches: ["master"]

  # Rebuild all documentation versions from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
# Runs queued between the run in-progress and latest queued are skipped.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          path: current
          fetch-depth: 0
          submodules: true
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
      - name: Build tagged documentation versions
        shell: bash
        run: |
          versions_dir="$RUNNER_TEMP/kdocs-versions"
          init_script="$GITHUB_WORKSPACE/current/.github/scripts/dokka-versioning.init.gradle"
          mkdir -p "$versions_dir"
          tags="$(git -C current tag --sort=version:refname)"
          built=0
          while IFS= read -r tag; do
            # Include 2.5.x and newer version tags, with optional v prefix and prerelease suffix.
            if [[ ! "$tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              continue
            fi
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            if (( major < 2 || (major == 2 && minor < 5) )); then
              continue
            fi
            version="${tag#v}"
            if [[ -e "$versions_dir/$version" ]]; then
              echo "::error::Duplicate documentation version: $version"
              exit 1
            fi
            echo "::group::Build KDocs for $tag"
            tag_dir="$RUNNER_TEMP/kdocs-tags/$tag"
            git -C current worktree add --detach "$tag_dir" "refs/tags/$tag"
            git -C "$tag_dir" submodule update --init --recursive
            (
              cd "$tag_dir"
              chmod +x gradlew
              ./gradlew dokkaGenerateHtml --init-script "$init_script" "-PdokkaVersion=$version"
            )
            test -f "$tag_dir/build/dokka/html/index.html"
            test -f "$tag_dir/build/dokka/html/version.json"
            mkdir -p "$versions_dir/$version"
            cp -a "$tag_dir/build/dokka/html/." "$versions_dir/$version/"
            built=$((built + 1))
            echo "::endgroup::"
          done <<< "$tags"
          if (( built == 0 )); then
            echo "::error::No version tags from 2.5.x onward found."
            exit 1
          fi
      - name: Build current KDocs with all versions
        working-directory: current
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew dokkaGenerateHtml "-PdokkaOlderVersionsDir=$RUNNER_TEMP/kdocs-versions"
          test -f build/dokka/html/index.html
          test -f build/dokka/html/version.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Dokka's versioning plugin includes the archived versions and their navigation.
          path: 'current/build/dokka/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
