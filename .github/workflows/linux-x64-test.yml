name: "Linux Test X64 master"

on:
  release:
    types: [published]
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  linux-x64-test:
    name: "linuxX64Test"

    runs-on: 'ubuntu-26.04'
    timeout-minutes: 360
    permissions:
      security-events: write

      actions: read
      contents: read

    strategy:
      fail-fast: true
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'

      - name: Test JavaScript and WebAssembly
        uses: ./.github/actions/test-web

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld binutils

      - run: |
          chmod +x gradlew
          ./gradlew :linuxX64Test --tests "asia.hombre.keccak.Tests"
