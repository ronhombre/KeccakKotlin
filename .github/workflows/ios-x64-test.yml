name: "iOS Test X64 master"

on:
  release:
    types: [published]
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  ios-x64-test:
    name: "iosX64Test"

    runs-on: 'macos-26-intel'
    timeout-minutes: 360
    permissions:
      security-events: write

      actions: read
      contents: read

    strategy:
      fail-fast: true
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'

      - name: Test JavaScript and WebAssembly
        uses: ./.github/actions/test-web

      - name: Install LLVM toolchain
        run: |
          brew install llvm
          if [ -d "/opt/homebrew/opt/llvm/bin" ]; then echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH; fi
          if [ -d "/usr/local/opt/llvm/bin" ]; then echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH; fi

      - name: Install Target Toolchain
        run: |
          rustup update stable
          rustup target add x86_64-apple-ios

      - run: |
          chmod +x gradlew
          ./gradlew :iosX64Test --tests "asia.hombre.keccak.Tests"
